<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our Anniversary ♥</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
:root{--ink:#150a0f;--wine:#3a1220;--rose:#d98a9b;--gold:#c9a36b;--ivory:#f3e9e4;--paper:#f1e6df;--paper-ink:#3a1a22;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--ink);color:var(--ivory);font-family:'EB Garamond',Georgia,serif;min-height:100vh}
.view{display:none;min-height:100vh}.view.on{display:block;animation:in 1.2s ease both}
@keyframes in{from{opacity:0}to{opacity:1}}
h1,h2{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;margin:0}
.en{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;color:var(--gold)}
/* gate */
#gate{display:none;place-items:center;text-align:center;padding:24px;background:radial-gradient(ellipse at 50% 35%,#4a1628 0%,var(--ink) 65%)}
#gate.on{display:grid}
.heart{font-size:56px;color:var(--rose);line-height:1;animation:beat 2.4s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.14)}30%{transform:scale(1)}45%{transform:scale(1.1)}}
#gate h1{font-size:clamp(38px,9vw,64px);margin:18px 0 6px}
#gate p{margin:0 0 28px;font-size:20px;opacity:.85}
.field{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
input{font:inherit;font-size:24px;text-align:center;letter-spacing:.12em;width:200px;padding:12px 14px;background:transparent;color:var(--ivory);border:1px solid var(--gold);border-radius:999px}
input::placeholder{color:#ffffff55}
input:focus-visible,button:focus-visible{outline:2px solid var(--rose);outline-offset:3px}
button{font:inherit;font-size:22px;padding:12px 28px;border-radius:999px;border:0;background:var(--rose);color:var(--ink);cursor:pointer;font-weight:700}
#err{height:28px;margin-top:14px;color:var(--rose);font-size:18px}
.shake{animation:sh .45s}
@keyframes sh{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
/* letter */
#letter{padding:48px 16px 80px;background:radial-gradient(ellipse at 50% 0%,#3d1426 0%,var(--ink) 60%)}
.paper{max-width:680px;margin:0 auto;background:var(--paper);color:var(--paper-ink);padding:clamp(28px,6vw,64px);border-radius:4px;box-shadow:0 30px 80px #000a;border-top:6px solid var(--rose)}
.paper h1{font-size:clamp(32px,7vw,46px);margin-bottom:6px}
.paper .en{color:#8a5a3a;font-size:20px;margin:0 0 26px}
.paper p{font-size:clamp(20px,4.6vw,23px);line-height:2.05;margin:0 0 18px}
.sign{font-family:'Pinyon Script',cursive;font-size:44px;margin-top:28px;text-align:right}
.go{text-align:center;margin-top:36px}
/* memories */
#memories{padding:56px 16px 96px;background:linear-gradient(var(--ink),#22101a)}
#memories>h2{text-align:center;font-size:clamp(34px,8vw,54px)}
#memories>.en{text-align:center;margin:6px 0 56px;font-size:20px}
.mem{max-width:900px;margin:0 auto 72px;display:grid;grid-template-columns:1fr 1fr;gap:clamp(20px,5vw,56px);align-items:center}
.mem:nth-of-type(even) img{order:2}
.mem img{width:100%;height:auto;display:block;border:8px solid var(--paper);border-radius:3px;box-shadow:0 20px 50px #000a;transform:rotate(-1.5deg)}
.mem:nth-of-type(even) img{transform:rotate(1.5deg)}
.txt{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:500;font-size:clamp(26px,4.4vw,36px);line-height:1.5}
.end{text-align:center;max-width:600px;margin:0 auto}
.end h2{font-size:clamp(34px,8vw,52px);color:var(--rose)}
@media(max-width:640px){.mem:nth-of-type(even) img{order:0}.mem,.mem:nth-of-type(even){grid-template-columns:1fr;text-align:center}}
.extra{max-width:640px;margin:0 auto 80px;text-align:center}
.big span{display:block;font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;font-size:clamp(96px,26vw,170px);line-height:1;color:var(--rose)}
.extra h2{font-size:clamp(30px,7vw,44px);margin-top:4px}
.sub{font-size:clamp(19px,4.4vw,22px);margin:10px 0 22px;opacity:.9}
.ask .field{margin-top:8px}.thanks{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:clamp(26px,6vw,34px);color:var(--gold);min-height:1.5em;margin-top:18px}
.fl{position:fixed;bottom:-30px;color:var(--rose);pointer-events:none;z-index:9;animation:up 2.8s ease-in forwards}
@keyframes up{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<section id="gate" class="view on">
 <div>
  <div class="heart" aria-hidden="true">♥</div>
  <h1>Something is waiting for you</h1>
  <p>Enter the date of our day to open it</p>
  <div class="field">
   <input id="pw" type="text" inputmode="numeric" placeholder="DD/MM/YY" autocomplete="off" aria-label="The date of our day">
   <button id="open">Open</button>
  </div>
  <div id="err" role="alert"></div>
 </div>
</section>

function show(id){document.querySelectorAll('.view').forEach(function(v){v.classList.remove('on')});$(id).classList.add('on');window.scrollTo(0,0)}
function b2u(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
function fail(){$('err').textContent="That's not the date. Try again \u2665";var f=document.querySelector('.field');f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake')}
function extras(){
 var el=$('days');
 if(el){
  var n=new Date(),d=Math.max(0,Math.round((Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())-Date.UTC(2024,9,25))/864e5)),done=false;
  var run=function(){
   if(done)return;done=true;
   if(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches){el.textContent=d;return}
   var st=null;
   var f=function(ts){if(!st)st=ts;var p=Math.min(1,(ts-st)/2200);el.textContent=Math.round(d*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)};
   requestAnimationFrame(f);
  };
  if('IntersectionObserver' in window){var io=new IntersectionObserver(function(e){if(e[0].isIntersecting){run();io.disconnect()}});io.observe(el)}else{run()}
 }
 ['y1','y2'].forEach(function(id){var b=$(id);if(b)b.onclick=yes});
}
function yes(){
 $('thanks').textContent='I knew it. Happy anniversary, my love \u2665';
 document.querySelector('.ask .field').style.display='none';
 for(var i=0;i<22;i++){(function(i){
  var s=document.createElement('span');s.className='fl';s.textContent='\u2665';
  s.style.left=(Math.random()*96)+'vw';s.style.fontSize=(18+Math.random()*30)+'px';s.style.animationDelay=(Math.random()*0.9)+'s';
  document.body.appendChild(s);setTimeout(function(){s.remove()},4200);
 })(i)}
}
async function check(){
 var d=$('pw').value.replace(/\D/g,'');
 if(d.length===8&&d.slice(4)==='2024'){d=d.slice(0,4)+'24'}
 if(d.length!==6||!(window.crypto&&crypto.subtle)){fail();return}
 $('open').disabled=true;$('err').textContent='Opening\u2026';
 try{
  var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(d),'PBKDF2',false,['deriveKey']);
  var k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b2u(BLOB.s),iterations:BLOB.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2u(BLOB.i)},k,b2u(BLOB.c));
  $('vault').innerHTML=new TextDecoder().decode(pt);
  $('next').onclick=function(){show('memories')};extras();
  $('err').textContent='';show('letter');
 }catch(e){fail()}
 $('open').disabled=false;
}
$('open').onclick=check;
$('pw').addEventListener('keydown',function(e){if(e.key==='Enter')check()});
</script>
